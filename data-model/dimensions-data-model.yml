id_prefixes:
- prefix: pub.
  entity: publications
- prefix: grant.
  entity: grants
- prefix: ur.
  entity: researchers
- prefix: grid.
  entity: organizations
- prefix: jour.
  entity: source_titles
- prefix: 'geonames:'
  entity: states / cities
note: >-
  Relationship rows are read from the per-source field references and the two
  cross-link diagrams on the Data Sources page. Field names are given as the DSL
  publishes them; where a link is expressed by more than one field the `via` value
  lists the alternatives rather than picking one.
