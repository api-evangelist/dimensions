note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented a "Free" tier with a
  1,000 requests/month quota and a 10 req/min rate limit. Dimensions publishes no
  such tier and no prices at all. https://www.dimensions.ai/pricing/ returns 404.
description: >-
  Dimensions publishes no public pricing for the Analytics API. Access is by
  institutional subscription, quoted per customer. There is no self-serve signup,
  no free developer tier, and no published price list — the only routes to a key
  are a sales quote or the free scientometric-research programme.
