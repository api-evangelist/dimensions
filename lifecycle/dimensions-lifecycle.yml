provider: Dimensions
providerId: dimensions
description: >-
  Versioning, deprecation and operational lifecycle for the Dimensions Analytics
  API. Dimensions runs an unusually explicit deprecation regime for a
  subscription-only API: fields are deprecated in the release notes and kept
  working until the next major version, and a public Deprecations History page
  lists every deprecated field, search index and function.
versioning:
  scheme: path major version + documented minor releases
  current_major: v2
  current_documented_version: '2.15'
  schema_version_reported: 2.15.1
  endpoint_current: /api/dsl/v2
  endpoint_alias: /api/dsl
  endpoint_alias_alt: /api/dsl.json
  auth_endpoint_unversioned: /api/auth
  cadence: minor release roughly every two weeks
  breaking_change_policy: >-
    "We strive to make the API always backward-compatible by never introducing
    changes to the query syntax or the data model that will alter significantly
    their behaviour." Improved data points arrive as NEW fields; the old field is
    deprecated, never deleted. Deprecated fields are removed only at a new major
    release, and remain available in the legacy version.
  source: https://docs.dimensions.ai/dsl/faq.html
deprecation_policy:
  published: true
  url: https://docs.dimensions.ai/dsl/releasenotes.html
  mechanism: >-
    Deprecations are announced in the dated release notes and catalogued on the
    Deprecations History section of the same page, split into Deprecated Fields,
    Partially Deprecated Fields, Deprecated Search Indexes and Deprecated
    Functions. Queries using a deprecated field keep working and return a warning
    in the response payload.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Signalling is in the response body and the docs, not in RFC 8594
    Sunset/Deprecation headers.
retirements:
- version: v1
  endpoint: /api/dsl/v1
  status: removed
  date: '2022-03'
  note: >-
    "V1 API. Currently in maintenance mode. Removed in March 2022." The /api/dsl
    and /api/dsl.json aliases pointed at V1 until December 2021 and have pointed
    at V2 since.
  source: https://docs.dimensions.ai/dsl/api.html
