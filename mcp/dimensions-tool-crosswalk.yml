provider: Dimensions
providerId: dimensions
description: 'Binds every Dimensions Analytics MCP tool to the REST operation that backs it. The Dimensions
  REST surface is deliberately tiny — one auth exchange and one query endpoint — because the real API
  surface is the Dimensions Search Language carried in the /dsl/v2 request body. Every data tool therefore
  resolves to the SAME operationId (dslQuery) and differs only in the DSL it composes, which is why operationId
  mapping alone understates the MCP server: the tools are the first machine-readable projection of the
  DSL that Dimensions has published.'
surfaces:
  openapi:
  - openapi/dimensions-query-api-openapi.yml
  - openapi/dimensions-authentication-api-openapi.yml
  rest_base: https://app.dimensions.ai/api
  graphql: null
  mcp:
    local_stdio: npx -y @digital-science-dsl/dimensions-analytics-mcp
    remote: https://www.dimensions.ai/wp-json/mcp/mcp-oauth-server
    gated: true
    note: The local server needs a subscriber API key and the remote endpoint needs OAuth, so no live
      tools/list was readable. Tool names and descriptions are verbatim from the provider docs; input
      schemas were not asserted.
