install:
- method: pip
  command: pip install dimcli -U
binary: dimcli
type: interactive REPL console (not a subcommand CLI)
capabilities:
- Interactive DSL query console with grammar autocompletion
- Persistent query history across sessions
- Pretty-printing and preview of JSON results
- Export of results to HTML and CSV
- Python API (dimcli.login / dimcli.Dsl().query) for notebook and script use
- pandas dataframe conversion of result sets
- Jupyter magic commands for querying, dataframe conversion, and interactive linked tables
auth:
