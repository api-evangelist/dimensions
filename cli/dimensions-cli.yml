description: >-
  dimcli is Digital Science's first-party Python client for the Dimensions
  Analytics API, and it ships an interactive command-line console for the
  Dimensions Search Language. Running `dimcli` in a terminal opens a REPL with
  syntax autocompletion, persistent history across sessions, pretty-printed and
  previewed JSON results, and export to HTML and CSV.
